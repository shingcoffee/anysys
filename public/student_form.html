<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Header -->
  <header class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center h-16">
        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
        <span class="ml-2 text-xl font-bold text-gray-900">Student Registration</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <form id="studentForm" class="space-y-6" action="/96546124/8151cd9c-b071-431d-b250-0e6e56bf63dd/teacher" method="POST">
      <!-- Form Card -->
      <div class="bg-white border border-gray-200 rounded-lg shadow-sm">
        <div class="px-6 py-4 border-b border-gray-100">
          <h3 class="text-base font-semibold text-gray-900">Student Information</h3>
          <p class="mt-1 text-sm text-gray-500">Please fill in the student details below.</p>
        </div>

        <div class="p-6 space-y-4">
          <!-- First Name -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="first_name">
              First Name <span class="text-red-500">*</span>
            </label>
            <input type="text"
                   id="first_name"
                   name="first_name"
                   required
                   placeholder="Enter first name"
                   class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
          </div>

          <!-- Last Name -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="last_name">
              Last Name <span class="text-red-500">*</span>
            </label>
            <input type="text"
                   id="last_name"
                   name="last_name"
                   required
                   placeholder="Enter last name"
                   class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
          </div>

          <!-- Age -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="age">
              Age <span class="text-red-500">*</span>
            </label>
            <input type="number"
                   id="age"
                   name="age"
                   required
                   min="1"
                   max="120"
                   placeholder="Enter age"
                   class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
          </div>

          <!-- Gender -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Gender <span class="text-red-500">*</span>
            </label>
            <div class="flex items-center gap-6 mt-2">
              <label class="inline-flex items-center cursor-pointer">
                <input type="radio"
                       name="gender"
                       value="male"
                       required
                       class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                <span class="ml-2 text-sm text-gray-700">Male</span>
              </label>
              <label class="inline-flex items-center cursor-pointer">
                <input type="radio"
                       name="gender"
                       value="female"
                       required
                       class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                <span class="ml-2 text-sm text-gray-700">Female</span>
              </label>
              <label class="inline-flex items-center cursor-pointer">
                <input type="radio"
                       name="gender"
                       value="other"
                       required
                       class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                <span class="ml-2 text-sm text-gray-700">Other</span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- Form Actions -->
      <div class="flex items-center justify-end gap-3">
        <button type="reset"
                class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg transition-all hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          Reset
        </button>
        <button type="submit"
                class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-white bg-indigo-600 border border-indigo-600 rounded-lg transition-all hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-600">
          Submit
        </button>
      </div>
    </form>
  </main>
</body>
</html>
