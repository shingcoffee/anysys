    descriptions:
      member_portal: Choose what members see in their portal.
      member_registration: Control whether new members can register.
      password_reset: Manage password recovery for members.
      account_security: Configure account security preferences.
      roles_permissions: Review roles and manage their permissions.
      user_access: Manage the roles assigned to your users.
      public_page_protection: Set request limits for public pages.
      website: Manage your site's appearance, content, and publishing.
      ai_assistant: Choose the assistant language and view the recording limit set by the platform owner.
      email_sending_limit: View the daily email limit set by the platform owner.
      email_personalization: Manage fields used to personalize emails.
      sms_sending_limit: View the daily text message limit set by the platform owner.
      payment_providers: Connect providers to receive customer payments.
      plan_subscription: Review your plan and manage your subscription.
      billing_payment_methods: Manage how your subscription is paid.
      invoices: View and download your organization's invoices.
