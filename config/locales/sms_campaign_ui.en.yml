      cancel_help: Messages already attempted will continue to receive delivery updates.
      completed_help: Completed means dispatch work is finished. Provider delivery updates can still arrive later; unknown does not mean failed.
      delete: Delete draft
      delete_help: Delete this unlaunched draft. Launched campaigns and delivery reports are retained.
