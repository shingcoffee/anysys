en:
  ai_assistant:
    subsystems:
      preflight:
        quota_exceeded: "This build adds %{needed} %{unit}, but your plan has room for %{remaining} more (limit %{limit}). Upgrade your plan or build part of it first."
        logins_unavailable: "People can't sign in to this workspace's records yet, because user accounts aren't enabled for its entities. Build it without sign-in, or ask the platform owner to enable user accounts."
      screen:
        unknown_value: "%{value} is not an address the admin gave. Use one from their messages, or leave the step out and ask for it."
        secret_value: "The %{field} of the %{step} step must stay empty. Leave the secret out and name it under needs_setup."
        filled_field: "%{field} is filled in before these steps run (with the signed-in member's own record, or the record chosen in an earlier step). Leave it as it is."
        user_hash: 'ctx[:%{variable}] is a read-only hash, so read ctx[:%{variable}]["%{key}"] instead of ctx[:%{variable}].%{key}. Its keys are id (the sign-in account, not a record), email, name, role and person_entries.'
      build:
        question_prompt: "%{name}: %{prompt}"
        value_question: "Which address should %{name} send to? Reply with the full address."
        questions_intro: "To finish building %{name}, I need a few answers."
        journey_unavailable: "This journey is no longer available for the domain."
        page_missing: "Its form page wasn't found in the generated journeys."
        waiting_processing: "It waits on processing that isn't set up yet: %{names}."
        unexpected: "The build of %{name} stopped unexpectedly. What it had already built stays."
        unauthorized: "The build of %{name} stopped because this account can no longer build in this workspace."
        secret_setup: "The %{field} of the %{step} step"
        processing_unwritten: "Start a new build to try again."
        domain_failed: "The build of %{name} stopped because its business area couldn't be created. Nothing was built."
        flows_failed: "The build of %{name} stopped because I couldn't design journeys that fit the requirements. Nothing was built. Tell me more about how the business works and start it again."
        preflight: "The build of %{name} stopped before building any records or pages:"
        entities: "The build of %{name} stopped while designing its records. No pages were built:"
        entities_failed: "The records couldn't be designed to fit the journeys. Start the build again."
        entity_gaps: "%{name} already exists but lacks fields or settings these journeys need. Change it, or ask for the new records under another name, then start the build again."
        link_missing: "%{name}: its records have no reference to the record they belong to."
      review:
        intro: "Here are the journeys I designed for %{name}. Check them before I build anything."
        question: "Build these journeys?"
        approve: "Build them"
        change: "Something needs changing"
        audiences:
          admin: "staff"
          member: "members"
          public: "visitors"
        steps:
          create: "%{label}: creates a %{record} (%{fields})"
          add: "%{label}: adds %{record} rows (%{fields})"
          update: "%{label}: changes the %{record} (%{fields})"
        starts: "Starts from a %{record} that is %{states}"
        starts_any: "Starts from any %{record}"
        statuses: "Statuses:"
        status: "%{record}: %{states}"
        not_covered: "Not covered:"
        separator: ", "
      report:
        title: "Finished building %{name}."
        journeys: "Journeys:"
        journey_launched: "%{name}: launched"
        journey_live: "%{name}: already live"
        journey_draft: "%{name}: left as a draft. %{reasons}"
        journey_failed: "%{name}: couldn't be built. %{errors}"
        processing: "Form processing:"
        processing_bound: "%{name}: set up on %{page}"
        processing_setup: "%{name}: set up on %{page}. Still to set up: %{items}"
        processing_unbound: "%{name}: written, but not set on %{page}. %{errors}"
        processing_skipped: "%{name}: left out, because it still needs: %{items}"
        processing_failed: "%{name}: couldn't be written. %{errors}"
        warnings: "Notes:"
        separator: "; "
        entities: "Records:"
        entity_created: "%{name}: created"
        entity_reused: "%{name}: already existed, reused"
        not_covered: "Not covered:"
      answers:
        received: "Thanks, I'm continuing to build %{name} with your answers."
        running: "I'm still building %{name}. I'll post here when it's done or when I need something. You can cancel it from the build message."
      status:
        running: "Building"
        waiting_for_answers: "Waiting for your answers"
        finished: "Build finished"
        failed: "Build stopped"
        cancelled: "Build cancelled"
      cancel:
        button: "Cancel build"
        confirm: "Cancel this build? What it has already built stays."
        not_active: "This build has already ended."
