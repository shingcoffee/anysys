---
zh-CN:
  flowchart_actions:
    string_manipulate:
      label: 字符串处理
      description: 对文本执行拆分、拼接、大小写和 Base64 等操作。
      fields:
        sourceVariable:
          label: 来源
          help: 本步骤读取的上下文路径。
          placeholder: 例如 text
        resultVar:
          label: 将结果保存为
          help: 后续步骤读取的变量名。
          placeholder: 例如 text
        operation:
          label: 操作（单项）
          help: 要执行的单项字符串操作。
          options:
            split: 拆分
            join: 拼接
            strip: 去空白
            pad_left: 左填充
            pad_right: 右填充
            truncate: 截断
            upcase: 大写
            downcase: 小写
            capitalize: 首字母大写
            camelize: 驼峰式
            underscore: 下划线式
            reverse: 反转
            replace: 替换
            gsub: 全局替换
            unicode_normalize: Unicode 规范化
            html_escape: HTML 转义
            html_unescape: HTML 反转义
            base64_encode: Base64 编码
            base64_decode: Base64 解码
            squish: 压缩空白
            titleize: 标题化
            parameterize: 参数化
            transliterate: 去重音
            mask_middle: 中间掩码
        operations:
          label: 操作流水线
          help: 按顺序执行的字符串操作。
          placeholder: "操作 -> 参数"
        regexEscape:
          label: 正则转义
          help: 将 gsub 模式视为字面量。
        encoding:
          label: 编码
          help: 将源字符串强制为此编码。
          options:
            utf8: UTF-8
            ascii: ASCII
            latin1: Latin-1
        delimiter:
          label: 分隔符
          help: 拆分与拼接使用的分隔符。
          placeholder: 例如 ,
        length:
          label: 长度
          help: 填充或截断的长度。
          placeholder: 例如 10
        padChar:
          label: 填充字符
          help: 填充时使用的字符。
          placeholder: 例如 " "（空格）
        pattern:
          label: 模式
          help: 替换或 gsub 使用的搜索模式。
          placeholder: "例如 \\d+"
        replacement:
          label: 替换为
          help: replace 或 gsub 的替换文本。
          placeholder: 例如 X
        urlSafe:
          label: URL 安全
          help: 使用 URL 安全的 Base64 字母表。
        stripPadding:
          label: 去除填充
          help: 去掉 Base64 末尾的填充字符。
        inputEncoding:
          label: 输入编码
          help: 编码前如何解释字节。
          options:
            utf8: UTF-8
            binary: 二进制
        lineWidth:
          label: 行宽
          help: 按此宽度换行编码结果（0 表示不换行）。
          placeholder: 0 表示单行
      errors:
        invalid_pipeline_op: "无效的流水线操作：%{name}"
    regex_extract:
      label: 正则提取
      description: 用正则表达式提取、检测或替换文本。
      fields:
        sourceVariable:
          label: 来源变量
          help: 本步骤读取的上下文路径。
          placeholder: 例如 text
        resultVar:
          label: 将结果保存为
          help: 后续步骤读取的变量名。
          placeholder: 例如 match
        pattern:
          label: 模式
          help: 要应用的正则表达式。
          placeholder: "例如 (\\d+)"
        operation:
          label: 操作
          help: 匹配、扫描、检测或替换。
          options:
            match: 匹配
            scan: 扫描
            test: 检测
            replace: 替换
        flags:
          label: 标志
          help: 标准 Ruby 正则标志。
          options:
            none: 无
            i: 忽略大小写
            m: 多行
            x: 扩展
        regexFlags:
          label: 正则标志组合
          help: 可组合 i、m、x、n。
          placeholder: 可组合 i、m、x、n
        returnType:
          label: 返回类型
          help: 首次匹配保留的内容。
          options:
            first: 首次
            all: 全部
            named_hash: 命名捕获
        captureGroup:
          label: 捕获组
          help: 捕获组序号（0 表示整次匹配）。
          placeholder: 例如 1
        replacement:
          label: 替换为
          help: replace 操作的替换文本。
          placeholder: "例如 [REDACTED]"
        fallbackValue:
          label: 回退值
          help: 无匹配时返回的 Ruby 表达式（例如 nil）。
          placeholder: 例如 nil
      errors:
        invalid_pattern: 正则表达式无效
    date_time_calc:
      label: 日期时间计算
      description: 加减、求差、格式化、解析时间，或转换时区。
      fields:
        operation:
          label: 操作
          help: 要执行的日期时间计算。
          options:
            now: 当前时间
            add: 加
            subtract: 减
            difference: 求差
            format: 格式化
            parse: 解析
            convert_timezone: 转换时区
            start_of: 时段开始
            end_of: 时段结束
            age: 年龄
            compare: 比较
        resultVar:
          label: 将结果保存为
          help: 后续步骤读取的变量名。
          placeholder: 例如 datetime
        sourceVariable:
          label: 来源变量
          help: 保存源时间的上下文路径。
          placeholder: 例如 start_date
        endVariable:
          label: 结束变量
          help: 保存结束时间的上下文路径。
          placeholder: 例如 end_date
        amount:
          label: 数量
          help: 要加或减的数量。
          placeholder: 例如 30
        unit:
          label: 单位
          help: 加减使用的时间单位。
          options:
            seconds: 秒
            minutes: 分
            hours: 小时
            days: 天
            weeks: 周
            months: 月
            years: 年
        formatString:
          label: 格式字符串
          help: format 使用的 strftime 模式。
          placeholder: "例如 %Y-%m-%d %H:%M"
        inputFormat:
          label: 输入格式
          help: strftime 模式或 iso。
          placeholder: strftime 模式或 iso
        outputFormat:
          label: 输出格式
          help: strftime 模式，或 iso8601、rfc3339、unix、unix_ms。
          placeholder: strftime 或 iso8601
        businessDays:
          label: 仅工作日
          help: 加减天数时跳过周末。
        timezoneAware:
          label: 时区感知
          help: 按指定时区解释时间。
        timezone:
          label: 时区
          help: IANA 时区名。
          placeholder: 例如 Asia/Tokyo
        dstPolicy:
          label: 夏令时策略
          help: 跨越夏令时切换时的计算方式。
          options:
            preserve_wall: 保留钟面
            preserve_utc: 保留 UTC
        sourceTimezone:
          label: 源时区
          help: 源时钟的 IANA 标识。
          placeholder: 例如 UTC
        targetTimezone:
          label: 目标时区
          help: 要转换到的 IANA 标识。
          placeholder: 例如 America/New_York
        preserveLocalTime:
          label: 保留本地时间
          help: 保留钟面数字，只更换时区。
        dstBehavior:
          label: 夏令时歧义
          help: 如何处理歧义的本地时间。
          options:
            raise_on_ambiguous: 歧义时报错
            prefer_earlier: 取较早
            prefer_later: 取较晚
      errors:
        invalid_format: outputFormat 必须是 strftime 模式，或 iso8601、rfc3339、unix、unix_ms 之一
        invalid_timezone: "%{field} 必须是合法的 IANA 时区"
    math_operation:
      label: 数学运算
      description: 对数值执行加减乘除及其他标量运算。
      fields:
        operation:
          label: 操作
          help: 要执行的数学运算。
          options:
            add: 加
            subtract: 减
            multiply: 乘
            divide: 除
            modulo: 取余
            power: 幂
            min: 最小
            max: 最大
            abs: 绝对值
            floor: 向下取整
            ceil: 向上取整
            round: 四舍五入
            sqrt: 平方根
            random: 随机
            percent: 百分比
            clamp: 钳制
        sourceVariable:
          label: 来源
          help: 本步骤读取的上下文路径。
          placeholder: 例如 a
        otherVariable:
          label: 另一操作数
          help: 二元运算的第二个操作数。
          placeholder: 例如 b
        resultVar:
          label: 将结果保存为
          help: 后续步骤读取的变量名。
          placeholder: 例如 number
        precision:
          label: 精度
          help: 小数位数。
          placeholder: 小数位数
        roundingMode:
          label: 舍入方式
          help: 设置精度时如何舍入结果。
          options:
            half_up: 四舍五入
            half_even: 银行家舍入
            floor: 向下
            ceiling: 向上
        divideByZero:
          label: 除零策略
          help: 除数为零时的返回值。
          options:
            raise: 报错
            nil: 空
            zero: 零
            infinity: 无穷
            nan: 非数
        minValue:
          label: 最小值
          help: 随机数的下限（含）。
        maxValue:
          label: 最大值
          help: 随机数的上限（含）。
      errors:
        min_greater_than_max: "%{field} 必须大于或等于下限"
    serialize_data:
      label: 序列化数据
      description: 把数据写成 JSON、XML、YAML 或 MessagePack。
      fields:
        sourceVariable:
          label: 来源变量
          help: 本步骤读取的上下文路径。
          placeholder: 例如 data
        resultVar:
          label: 将结果保存为
          help: 后续步骤读取的变量名。
          placeholder: 例如 serialized
        format:
          label: 格式
          help: 序列化格式。
          options:
            json: JSON
            xml: XML
            yaml: YAML
            msgpack: MessagePack
            csv: CSV
            toml: TOML
        pretty:
          label: 美化输出
          help: 缩进 JSON 输出。
        jsonMaxDepth:
          label: JSON 最大深度
          help: 最大嵌套层数（0 表示不限制）。
          placeholder: 0 表示不限制
        includeRoot:
          label: 包含根节点类型
          help: 在根元素上保留 XML 类型属性。
        rootElement:
          label: 根元素
          help: XML 根元素名。
          placeholder: 例如 data
        excludeNils:
          label: 排除空值
          help: 序列化前去掉 nil。
    parse_data:
      label: 解析数据
      description: 把 JSON、CSV、XML、YAML、TOML 或 properties 文本解析为结构数据。
      fields:
        sourceVariable:
          label: 来源变量
          help: 本步骤读取的上下文路径。
          placeholder: 例如 raw_data
        resultVar:
          label: 将结果保存为
          help: 后续步骤读取的变量名。
          placeholder: 例如 data
        format:
          label: 格式
          help: 要解析的负载格式。
          options:
            json: JSON
            csv: CSV
            xml: XML
            yaml: YAML
            toml: TOML
            properties: properties
        csvHeaders:
          label: CSV 表头
          help: 将首行作为列名。
        csvDelimiter:
          label: CSV 分隔符
          help: 列分隔符。
          placeholder: 例如 , 或 ;
        quoteChar:
          label: 引号字符
          help: CSV 引号字符。
          placeholder: 例如 " 或 '
        skipRows:
          label: 跳过行数
          help: 跳过开头的 N 行。
          placeholder: 跳过开头的 N 行
        encoding:
          label: 编码
          help: CSV 文本的字符编码。
          options:
            utf_8: utf-8
            utf_16: utf-16
            ascii: ascii
            iso_8859_1: iso-8859-1
        colTypes:
          label: 列类型
          help: 按列名转换 CSV 列。
          placeholder: "列名 -> 类型"
        xmlRoot:
          label: XML 根
          help: 可选，解开该 XML 根键。
          placeholder: 例如 root
        strictMode:
          label: 严格模式
          help: 解析失败时抛出，而不是让步骤失败。
        symbolizeKeys:
          label: 符号键
          help: 将哈希键转为符号。
  flowchart_runtime:
    errors:
      string_manipulate:
        failed: "无法处理该字符串（%{reason}）。"
      regex_extract:
        failed: "无法应用正则表达式（%{reason}）。"
      date_time_calc:
        failed: "无法计算日期或时间（%{reason}）。"
      math_operation:
        failed: "无法完成数学运算（%{reason}）。"
      serialize_data:
        failed: "无法序列化数据（%{reason}）。"
      parse_data:
        failed: "无法解析数据（%{reason}）。"
