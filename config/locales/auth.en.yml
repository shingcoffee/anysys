en:
  auth:
    errors:
      owner_role_protected: "Only the platform owner can change the platform owner's roles."
      single_reserved_role: "A user can have only one of owner, admin, or member."
      reserved_role_required: "Each user must have one of owner, admin, or member."
      role_key_taken: "already taken"
      system_role_undeletable: "system role cannot be destroyed"
      system_role_uneditable: "system role cannot be edited"
      role_grants_locked: "role is locked"
      role_grants_invalid: "Could not update role grants."
      platform_grant_forbidden: "Only the platform owner can grant platform-scoped permissions."
    # Repeated words/labels shared across the auth surfaces.
    common:
      sign_in: "Sign in"
      back_to_sign_in: "Back to sign in"
      remembered_it: "Remembered it?"
      new_password: "New password"
      confirm_password: "Confirm password"
      verification_code: "Verification code"
      otp_placeholder: "000000"
      send_reset_link: "Send reset link"
      email: "Email"
      min_chars_placeholder: "At least %{count} characters"

    # User-facing flash messages emitted by the Authentication::* controllers.
    flash:
      sign_in_first: "Please sign in first."
      auth_not_enabled: "Authentication is not enabled for this account."
      confirmation_sent: "We sent a confirmation link to %{email}. Please click it to activate your account."
      mfa:
        enabled: "Two-factor authentication has been enabled."
        disabled: "Two-factor authentication has been disabled."
        verified: "Verification successful."
        invalid_code: "Invalid verification code. Please try again."
        throttled: "Too many verification attempts. Please wait a few minutes and try again."
        reauth_required: "Re-enter your current password or a verification code to disable 2FA."
        already_enabled: "Two-factor authentication is already enabled."
      password:
        throttled: "Too many password-reset requests. Please wait a few minutes and try again."
      confirmation:
        throttled: "Too many confirmation requests. Please wait a few minutes and try again."
        invalid: "That confirmation link is invalid or has expired. Sign in to resend it."
      sign_in_link:
        throttled: "Too many sign-in link requests. Please wait a few minutes and try again."
        invalid: "That sign-in link is invalid or has expired. Request a new one."
      mfa_recovery:
        throttled: "Too many recovery requests. Please wait a few minutes and try again."
      customer_signup:
        throttled: "Too many sign-up requests. Please wait a few minutes and try again."
        already_confirmed: "This account is already confirmed. Please sign in."

    sessions:
      shell_title: "Welcome back."
      shell_subtitle: "Sign in to continue."
      remember_me: "Remember me"
      forgot_password: "Forgot password?"
      submit: "Sign in"
      email_sign_in_link: "Email me a sign-in link"
      or: "or"
      email_placeholder: "you@example.com"
      create_account_link: "Create an account"

    unconfirmed:
      title: "Please confirm your email."
      sent_html: "We sent a confirmation link to <strong>%{email}</strong>. Click it to activate your account, then sign in."
      resend: "Resend confirmation"
      resend_disabled: "Resending confirmation is currently disabled. Contact your administrator."

    registrations:
      new:
        shell_title: "Create your account."
        shell_subtitle: "Join your organization's portal in under a minute."
        heading: "Sign up"
        have_account: "Already have an account?"
        submit: "Create account"
      edit:
        shell_title: "Edit your profile."
        shell_subtitle: "Update your account information and password."
        heading: "Edit profile"
        subheading_html: "Change what's displayed on your account."
        change_password: "Change password"
        change_password_hint: "Leave blank to keep your current password."
        current_password_hint: "We need your current password to confirm changes."
        set_password_hint: "You have not set a password yet. Choose one below to enable email and password sign-in."
        submit: "Update profile"
      disabled:
        shell_title: "Sign-up is paused."
        shell_subtitle: "This organization isn't accepting new accounts right now."
        heading: "Sign-up is currently disabled"
        body: "Sign-up is currently disabled for this organization. Please contact your administrator if you need an account."

    customer_registrations:
      new:
        shell_title: "Create your account."
        shell_subtitle: "Enter your email. We'll confirm the inbox, then open your workspace."
        heading: "Create an account"
        have_account: "Already have an account?"
        submit: "Create account"
      disabled:
        shell_title: "Account sign-up is paused."
        shell_subtitle: "New accounts aren't being accepted right now."
        heading: "Account sign-up is currently disabled"
        body: "Account sign-up is currently disabled. Please contact the platform administrator."
      check_email:
        shell_title: "Please confirm your email."
        shell_subtitle: "Activate your account from the inbox."
        heading: "Check your inbox"
        body_html: "We sent a confirmation link to <strong>%{email}</strong>. Click it to activate your account."
      expired:
        shell_title: "This link has expired."
        shell_subtitle: "Request a new confirmation email to continue."
        heading: "Link expired"
        body: "That confirmation link is invalid or has expired. Enter your email again to get a new one."
        cta: "Back to create account"
      errors:
        retry: "Please try again."
        failed: "Could not create the account. Please try again."

    sign_in_links:
      check_email:
        shell_title: "Check your inbox."
        shell_subtitle: "Use the sign-in link we just sent."
        heading: "Check your inbox"
        body_html: "If <strong>%{email}</strong> has an account, we sent a sign-in link. It expires in 15 minutes."
        resend: "Resend sign-in link"

    passwords:
      new:
        shell_title: "Reset your password."
        shell_subtitle: "We'll email you a link to set a new one."
        heading: "Forgot password"
        subheading: "Enter the email you registered with."
      edit:
        shell_title: "Set a new password."
        shell_subtitle: "Choose something memorable but hard to guess."
        subheading: "This will replace your existing password."
        submit: "Set new password"
      disabled:
        shell_title: "Password reset is paused."
        shell_subtitle: "This organization has password reset turned off."
        heading: "Password reset is currently disabled"
        body: "Password reset is currently disabled for this organization. Please contact your administrator for help recovering your account."

    mfa_recoveries:
      new:
        shell_title: "Recover access."
        shell_subtitle: "Lost your authenticator? We'll email you a link to disable two-factor authentication."
        heading: "Reset two-factor"
        subheading: "Enter the email tied to your account."
      create:
        shell_title: "Check your email."
        shell_subtitle: "If that address belongs to a member account with two-factor authentication enabled, we just sent a reset link. The link expires in 15 minutes."
        heading: "Reset link sent"
        subheading_html: "Open it from the device you'd like to sign in on."
        spam_prompt_html: "Didn't get it? Check your spam folder, or"
        request_new_link: "request a new link"
      consume:
        shell_title: "Confirm the reset."
        shell_subtitle: "This will turn off two-factor authentication on your account."
        heading: "Disable two-factor authentication?"
        subheading: "Only continue if you requested this reset. You will need to set two-factor up again after you sign in."
        submit: "Disable two-factor authentication"

    mfa_sessions:
      show:
        shell_title: "One more step."
        shell_subtitle: "Enter the code from your authenticator app to finish signing in."
        heading: "Two-factor verification"
        subheading: "Open your authenticator app and grab the 6-digit code for this account."
        trust_device: "Trust this device for 30 days"
        verify: "Verify"
        lost_authenticator: "Lost your authenticator?"
        sign_out: "Sign out"

    mfa_setups:
      show:
        shell_title: "Add an extra layer."
        shell_subtitle: "Two-factor authentication keeps your account safe even if your password is compromised."
        heading: "Set up 2FA"
        subheading: "Scan the QR code with your authenticator app, then enter the 6-digit code it shows you."
        step1_title: "Scan with your authenticator"
        step1_hint: "Use Google Authenticator, Authy, 1Password, or any TOTP app."
        manual_key_prompt_html: "Can't scan? Enter this key manually:"
        step2_title: "Confirm with a code"
        step2_hint: "Enter the 6-digit code your authenticator is showing right now."
        submit: "Verify and enable 2FA"

    mailer:
      confirmation:
        greeting: "Hi %{email},"
        title: "Confirm your email"
        instructions: "Confirm this email address to finish setting up your account."
        action: "Confirm email address"
        preheader: "Confirm your email to activate your Anysys account."
        heading: "Account"
        fallback: "If the button does not work, copy and paste this link into your browser:"
        ignore: "If you did not create this account, you can ignore this email."
        brand: "Anysys"
        footer: "Sent by Anysys. This is a transactional message — replies are not monitored."
      customer_signup:
        subject: "Confirm your Anysys account"
        greeting: "Hi %{email},"
        title: "Confirm your email"
        instructions: "Confirm this email address to finish creating your organization. This link expires in 3 days."
        action: "Confirm email address"
        preheader: "Confirm your email to activate your Anysys account."
        heading: "Account"
        fallback: "If the button does not work, copy and paste this link into your browser:"
        ignore: "If you did not create this account, you can ignore this email."
        brand: "Anysys"
        footer: "Sent by Anysys. This is a transactional message — replies are not monitored."
      sign_in_link:
        subject: "Your Anysys sign-in link"
        greeting: "Hi %{email},"
        title: "Sign in to your account"
        instructions: "Use the button below to sign in. This one-time link expires in 15 minutes."
        action: "Sign in to Anysys"
        preheader: "Your one-time sign-in link is ready — it expires in 15 minutes."
        heading: "Sign in"
        fallback: "If the button does not work, copy and paste this link into your browser:"
        ignore: "If you did not request this, you can ignore this email."
        brand: "Anysys"
        footer: "Sent by Anysys. This is a transactional message — replies are not monitored."
      reset_password:
        greeting: "Hi %{email},"
        title: "Reset your password"
        instructions: "We received a request to change the password for this account. Choose a new one below."
        action: "Choose a new password"
        preheader: "Reset your Anysys password."
        heading: "Security"
        fallback: "If the button does not work, copy and paste this link into your browser:"
        ignore: "If you did not request a password change, you can ignore this email."
        note: "Your password will not change until you choose a new one."
        brand: "Anysys"
        footer: "Sent by Anysys. This is a transactional message — replies are not monitored."

    shared:
      category_tabs:
        all_templates: "All Templates"
      property_editor:
        title: "Edit Element Properties"
        subtitle: "Configure the properties and behavior of this element."
        save: "Save Properties"
      template_picker:
        no_results_title: "No templates found"
        no_results_hint: "Try adjusting your search or category filter"
