        capabilities:
          kicker: Everything in one place
          heading: The system behind your business. The website in front of it.
          subhead: Stop stitching together spreadsheets, form tools and site builders. Anysys gives you every building block in one beautifully connected workspace.
          items:
            - title: Custom records
              body: Model anything your business tracks — members, bookings, orders, cases — with fields that fit like a glove.
            - title: Smart forms
              body: Capture applications, registrations and requests that flow straight into your records.
            - title: Stunning websites
              body: Launch polished, responsive pages with themes, imagery and copy that feel unmistakably yours.
            - title: AI assistant
              body: Brief it by typing or by voice. It drafts structures, pages and copy while you steer.
            - title: Members & payments
              body: Sign-ups, sign-ins, permissions and online payments — switched on when you are ready.
            - title: Email & SMS
              body: Reach every customer with configured messaging and delivery tracking built right in.
        website:
          heading: A first impression that wins customers.
          body: |-
            Your website isn't an afterthought — it's the storefront of your entire operation. Pick a theme, drop in your imagery and polish every word with AI at your side. Preview each page pixel-perfect, then publish in a click.

            Every form on your site feeds straight into your records, so the moment a visitor signs up, your business already knows.
          image_url: /site-images/anysys/anysys-photo-studio-owner.webp
          image_side: right
        steps:
          kicker: From idea to launch
          heading: Three steps. Zero code.
          items:
            - title: Describe
              body: Tell Anysys what your business does and what visitors should find. Plain words are all it takes.
            - title: Refine
              body: Review the generated records, forms and pages. Tweak anything with intuitive visual editors.
            - title: Launch
              body: Publish your website, switch on payments and messaging, and open your doors.
        faq:
          kicker: FAQ
          heading: Questions? We've got answers.
          items:
            - question: Do I need to know how to code?
              answer: Not a single line. Describe your business in plain language and Anysys drafts your system and website. Intuitive visual editors handle the rest.
            - question: What can the AI assistant do?
              answer: From one plain-language brief it drafts record types, form pages and up to five website pages, and places the photos you attach. It asks before changing anything that already exists, and nothing is published until you say so.
            - question: Can I review pages before publishing?
              answer: Always. Every AI proposal is an editable draft — preview and perfect each page before it goes live.
            - question: Does Anysys work in Chinese?
              answer: Yes. The entire workspace speaks both English and Simplified Chinese, and you can brief the assistant in either language.
            - question: Can I download the Windows app?
              answer: The Windows desktop app is coming soon and is not yet available to download. It is designed to host your whole workspace on a computer you control; details on AI connections, external services and backups will be shared before release.
        cta:
          headline: Your next big idea deserves a launchpad.
          body: Brief the AI assistant this afternoon and launch a working system and a beautiful website.
