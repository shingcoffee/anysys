          kicker: Included in every plan
          heading: More than a plan. A complete, connected workspace.
          subhead: Every tier unlocks the same beautifully integrated platform — you only choose how much room you need.
          items:
            - title: AI assistant
              body: Brief it by typing or voice, then review the connected records, forms and page drafts it prepares.
            - title: Records, forms & websites
              body: Define your record types, collect information with forms and preview your website before publishing.
            - title: Members, payments & messaging
              body: Use member accounts, payments, email and SMS with the required services configured.
        faq:
          kicker: FAQ
          heading: Pricing, answered.
          items:
            - question: What are the Free plan limits?
              answer: In the standard plan guide, Free is $0 per month, with up to 10 pages, 5 custom record types and 1 member seat.
            - question: Do paid plans have a trial?
              answer: In the standard plan guide, Starter, Pro and Enterprise each include a 14-day trial. Your workspace shows available trial offers.
            - question: What do these limits count?
              answer: Pages are pages created in the page builder, including form pages—not the marketing pages in the website builder. Custom record types are the kinds of data you define, not individual records. Member seats count registered workspace accounts, including administrators.
            - question: How do billing and usage charges work?
              answer: This guide shows reference monthly prices in USD. Your workspace billing settings show available plans and offers, your billing currency and any applicable usage charges.
        cta:
          headline: Start free. Scale without limits.
          body: Create your workspace today and upgrade anytime from billing.
      about:
        hero:
          eyebrow: About Anysys
          headline: "We build tools for\npeople who build."
          subhead: Anysys exists for founders, operators and makers who refuse to bend their business around rigid software. We give your expertise a workspace powerful enough to match it.
          image_url: /site-images/anysys/anysys-photo-about-team.webp
        stats:
