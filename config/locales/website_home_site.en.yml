      assistant:
        kicker: Anysys AI assistant
        heading: An AI teammate that builds while you talk.
        subhead: Describe what you need and the assistant drafts the records, forms and website pages to match — then refines them with you, step by step.
        items:
          - title: Brief it your way
            body: Type a sentence, dictate with your voice or attach photos of your work. Mention existing records with @ and the assistant picks up the context instantly.
          - title: Builds your records
            body: Creates record types with fields, links and calculated values — and asks before changing anything that already exists.
          - title: Turns records into forms
            body: Generates ready-to-use form pages straight from your record types, so every answer lands where it belongs.
          - title: Drafts your website
            body: Writes up to five pages around your business and places your uploaded photos where they fit best.
          - title: Undo in one click
            body: Changed your mind? Roll back a fresh website draft instantly, as long as it hasn't been published or edited.
          - title: You stay in charge
            body: Nothing goes live until you publish it. Work in English or Simplified Chinese, and pick up any conversation right where you left off.
      desktop:
        status: Windows desktop app · Coming soon
        headline: Your workspace. Your hardware. Your rules.
        panel:
          subhead: The upcoming Anysys desktop app runs your entire workspace on a computer you control — the same records, forms and website builder, hosted on hardware you own. Built for teams that demand total data sovereignty.
          cards:
            - title: Host it on your own PC
              body: Run your full workspace on a Windows machine you manage, right from the desktop app.
              image_url: /site-images/anysys/anysys-photo-desktop-night.webp
            - title: Your records, your control
              body: Locally hosted records live on hardware you own. Nothing leaves without your say.
              image_url: /site-images/anysys/anysys-photo-desktop-night.webp
            - title: Private — even from Anysys
              body: The desktop app is designed to keep locally hosted records completely outside Anysys's reach.
              image_url: /site-images/anysys/anysys-photo-desktop-night.webp
