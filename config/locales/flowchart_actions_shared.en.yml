en:
  flowchart_actions:
    shared:
      fields:
        resultVar:
          label: Save result as
          help: Name of the variable later steps read.
        sourceVariable:
          label: Source
          help: Context path this step reads.
        retryOnTransportError:
          label: Retry on transport error
          help: Retry only when the request is idempotent.
        retryAttempts:
          label: Retry attempts
          help: Extra transport attempts (1–2).
        connectTimeout:
          label: Connect timeout
          help: Seconds to wait for a connection (1–5).
        readTimeout:
          label: Read timeout
          help: Seconds to wait for a response (1–9).
        circuitBreaker:
          label: Circuit breaker
          help: Fail fast when the remote is unhealthy.
        breakerName:
          label: Breaker name
          help: Cache key suffix for this breaker.
        failureThreshold:
          label: Failure threshold
          help: Failures before the breaker opens (1–20).
        resetTimeoutSeconds:
          label: Reset timeout
          help: Seconds before a half-open retry (10–3600).
      errors:
        required: "%{field} is required"
        invalid_identifier: "%{field} must be a valid identifier path"
        reserved_name: "%{field} cannot be %{value}"
        not_in_list: "%{field} must be one of: %{allowed}"
        out_of_range: "%{field} must be between %{min} and %{max}"
        too_long: "%{field} must be at most %{max_length} characters"
        invalid_expression: "%{field} must be a single safe Ruby expression"
        not_one_statement: "%{field} must be exactly one statement"
        invalid_template: "%{field} is not a valid template"
        not_boolean: "%{field} must be true or false"
        unknown_attribute: "%{attribute} is not an attribute of %{entity}"
        unknown_reference: "%{field} does not match a known %{source}"
        unknown_field: "%{field} is not a recognized setting"
        retry_not_idempotent: "Retry is only allowed on idempotent requests"
        timeout_exceeds_run_limit: "connectTimeout plus readTimeout must be at most %{cap} seconds"
        invalid_integer: "%{field} must be an integer"
        invalid_decimal: "%{field} must be a number"
        invalid_list: "%{field} must be a list"
        invalid_mapping: "%{field} must be a list of key/value pairs"
        invalid_conditions: "%{field} must be a condition group"
        en_required: "%{field} must include an English (en) value"
        missing_customer_scope: "Entity lookup requires a customer scope"
        entity_not_accessible: "Entity %{id} is not accessible to this customer"
