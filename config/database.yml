# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: <%= ENV.fetch("SQLITE_TIMEOUT") { 5000 } %>

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  # TEST_ENV_NUMBER is set by parallel_tests (blank for worker 1, "2", "3"… for
  # the rest), giving each parallel worker its own SQLite file. Blank/unset
  # collapses to "storage/test.sqlite3", preserving single-process behaviour.
  database: <%= ENV.fetch("TEST_DATABASE") { "storage/test#{ENV['TEST_ENV_NUMBER']}.sqlite3" } %>
  # Test DBs are disposable and rebuilt from schema, so trade durability for
  # speed: keep the rollback journal in RAM and skip fsync. This attacks the
  # dominant cost of a create-heavy FactoryBot suite (disk writes per example).
  # Merged over ActiveRecord's DEFAULT_PRAGMAS (Rails 8.1 SQLite3Adapter).
  pragmas:
    journal_mode: memory
    synchronous: "off"

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
